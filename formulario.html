<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulário - IFSC ADS Frontend I</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1>Angelo Augusto Vettorazzi</h1>
        <p>Olá, o meu nome é <em><strong>Angelo Augusto Vettorazzi</strong></em>. Atualmente, eu sou um estudante do curso de Análise e Desenvolvimento de Sistemas do <a href="https://www.ifsc.edu.br/" target="_blank">IFSC</a>.</p>
    </header>
    <hr>
    <main>
        <h2>Formulário para seu Universo Favorito</h2>
        <form method="post">
            <label>Nome do Universo: <input type="text" name="nomeUniverso"></label>
            <br>
            <label>Nome do Autor/Desenvolvedor: <input type="text" name="autorUniverso"></label>
            <p>Tipo de Universo:
                <label><input type="radio" name="tipoUniverso" value="jogo">Jogo</label>
                <label><input type="radio" name="tipoUniverso" value="serie">Série</label>
                <label><input type="radio" name="tipoUniverso" value="livro">Livro</label>
                <label><input type="radio" name="tipoUniverso" value="animeManga">Anime/Manga</label>
            </p>
            <label>Uma Cor que poderia descrever o Universo: <input type="color" name="corUniverso"></label>
            <br>
            <label>Data em que conheceu o Universo: <input type="date" name="dataUniverso"></label>
            <br>
            <label>Avaliação do Universo (0 a 5): <input type="range" name="avaliacaoUniverso" min="0" max="5"></label>
            <br>
            <label>Comentários sobre o Universo: <textarea name="comentarioUniverso" rows="1"></textarea></label>
            <br>
            <input type="submit" value="Mandar Formulário">
        </form>
        <p><a href="index.html"><-- Retornar para página principal</a></p>
    </main>
    <hr>
    <footer>
    </footer>
</body>
</html>
